name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a production deploy halfway through.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Every check runs as its own job, so the four start together and the run ends when the slowest one
# does instead of adding them up. `typecheck`, `test`, and `build` keep Turbo's cache between runs: a
# package whose inputs did not change replays its last result instead of doing the work again.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      # Same cache as the other jobs, kept apart so no job evicts another's entries.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-typecheck-${{ hashFiles('apps/**', 'packages/**', 'examples/**', 'pnpm-lock.yaml', 'turbo.json', 'tsconfig*.json', 'vite.config.ts') }}
          restore-keys: |
            turbo-${{ runner.os }}-typecheck-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      # Turbo keeps each task's outputs and logs under .turbo/cache, keyed by the task's inputs.
      # The key hashes the sources, so an unchanged checkout restores the exact cache; a near miss
      # restores the last run, and Turbo still checks every task's own hash before it reuses it.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-test-${{ hashFiles('apps/**', 'packages/**', 'examples/**', 'pnpm-lock.yaml', 'turbo.json', 'tsconfig*.json', 'vite.config.ts') }}
          restore-keys: |
            turbo-${{ runner.os }}-test-
      - run: pnpm install --frozen-lockfile
      # The whole-game runs (`pnpm test:full`) take over a minute each, so they run by hand when
      # balance moves, not on every push.
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      # Same cache as the other jobs, kept apart so no job evicts another's entries.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-${{ hashFiles('apps/**', 'packages/**', 'examples/**', 'pnpm-lock.yaml', 'turbo.json', 'tsconfig*.json', 'vite.config.ts') }}
          restore-keys: |
            turbo-${{ runner.os }}-build-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  deploy:
    needs: [check, typecheck, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://playquorum.dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Vite inlines the PostHog token at build time; Alchemy fails a prod deploy without it.
      VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY || vars.VITE_POSTHOG_KEY }}
      # Sentry (ADR 0013). The DSN is public: Vite inlines it, and Alchemy fails a prod deploy
      # without it. The release is the commit, so events, source maps, and regressions line up.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN || vars.VITE_SENTRY_DSN }}
      VITE_SENTRY_RELEASE: ${{ github.sha }}
      # Only the build uploads source maps. Without the token it skips the upload.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG || vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || vars.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sentry reads the commit history to attach commits to the release.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec alchemy deploy --stage prod --yes
      # The release exists from the build (the Sentry plugins create it). These steps add what the
      # plugins would run twice, once per bundler: its commits and its deploy.
      - name: Attach commits to the Sentry release
        # Both steps are bookkeeping: a failure must not fail a deploy that already shipped.
        continue-on-error: true
        run: pnpm dlx @sentry/cli@3.8.2 releases set-commits "$VITE_SENTRY_RELEASE" --local --ignore-missing
      - name: Record the Sentry deploy
        continue-on-error: true
        run: pnpm dlx @sentry/cli@3.8.2 releases deploys "$VITE_SENTRY_RELEASE" new --env production --url https://playquorum.dev
