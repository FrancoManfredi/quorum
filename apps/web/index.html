<!doctype html>

    <!-- The title screen is dark: paint the first frame to match it. -->
    <style>
      html {
        background: #141517;
      }
      noscript {
        display: block;
        padding: 24px;
        color: #eaebec;
        font-family: system-ui, sans-serif;
      }
      noscript a {
        color: #58cef8;
      }
    </style>
    <title>Quorum — a systems design game for software engineers</title>

    <meta property="og:type" content="website" />

    <meta property="og:image:height" content="630" />

    <!--
      Amp's feedback widget remembers that it was shown and then appears on every visit.
      Load it only for a page opened with ?amp, so it never follows a reader around.
    -->
    <script>
      if (new URLSearchParams(window.location.search).has('amp')) {
        const widget = document.createElement('script')
        widget.src = 'https://ampcode.com/w/client_01M6S4QDB4JJ19J6NV7FCJ66C2.js'
        widget.async = true
        document.head.append(widget)
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
